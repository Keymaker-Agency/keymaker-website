# Keymaker Website - a Trinity agent template (and the site itself)
# Part of the Keymaker agency starter set (keymaker.agency), built in public during the
# Agent-Native Agency workshop series. Public. Apache 2.0.
name: keymaker-website
display_name: "Keymaker Website"
description: |
  The website agent of Keymaker. Owns the agency's Next.js site: writes pages on a branch,
  opens a pull request, and a person merges it (a merge is a production deploy on Vercel).
  Prices are rendered from the agency canon at build time, never typed in. The site's
  "Start a project" form files each request into a private intake queue and wakes the
  orchestrator through a signed Trinity webhook.
tagline: "The front door. Pull requests, never pushes."
version: "0.1.0"
author: "Keymaker (keymaker.agency)"

resources:
  cpu: "1"
  memory: "2g"

avatar_prompt: >
  A brass key resting on a dark wooden desk beside a laptop showing a clean website layout,
  warm lamp light, photographic.

use_cases:
  - "Add a short section to the home page about who we work with"
  - "Is the site showing the current prices?"
  - "Change the hero line to something shorter - open a PR, I will review it"

capabilities:
  - website-editing
  - pull-request-workflow
  - canon-rendered-pricing

credentials: {}
